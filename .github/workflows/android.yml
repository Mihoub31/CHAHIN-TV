name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare assets and icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p app/src/main/assets
          cp index.html tv.html sw.js icon.svg icon-192.png icon-512.png manifest.webmanifest manifest-tv.webmanifest app/src/main/assets/
          cp -r assets app/src/main/assets/assets
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            mkdir -p app/src/main/res/mipmap-$n
            convert icon-512.png -resize ${s}x${s} app/src/main/res/mipmap-$n/ic_launcher.png
          done
          mkdir -p app/src/main/res/drawable
          convert icon-512.png -resize 320x180 -background '#040b12' -gravity center -extent 320x180 -flatten app/src/main/res/drawable/tv_banner.png
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk chahin-tv.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CHAHIN TV (derniere version)
          make_latest: true
          files: chahin-tv.apk
